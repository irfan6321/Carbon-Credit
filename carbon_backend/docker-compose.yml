version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./app:/app
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      - redis